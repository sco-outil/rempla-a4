<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Optimiseur d'impôts</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B4DDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Optimiseur impôts">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#EEF1F6;--surface:#FFFFFF;--ink:#11203B;--muted:#56637C;--line:#D5DBE6;--accent:#1B4DDB;--accent-ink:#FFFFFF;--bad:#B42318;--bad-bg:#FCE9E7}
@media (prefers-color-scheme: dark){:root{--bg:#0C1322;--surface:#142038;--ink:#E7ECF7;--muted:#9AA7C1;--line:#26334F;--accent:#7FA3FF;--accent-ink:#0C1322;--bad:#FF8F86;--bad-bg:#3D1C1A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px;line-height:1.25}
p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px}
.row{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.row input{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="on" hidden>
  <h1>Optimiseur d'impôts</h1>
  <p>Cette appli est protégée. Entrez le mot de passe pour l'ouvrir.</p>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>
  <label class="row" for="show"><input id="show" type="checkbox"> Afficher le mot de passe</label>
  <label class="row" for="rem"><input id="rem" type="checkbox" checked> Se souvenir sur cet appareil</label>
  <div class="err" id="err" hidden>Mot de passe incorrect. Vérifiez les majuscules et les caractères spéciaux.</div>
  <button id="go" type="submit">Ouvrir</button>
</form>

  var KEY = "verrou-" + D.id;
  var ub = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var bb = function (u) { var s = ""; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");

  function decrypt(bits) {
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({name: "AES-GCM", iv: ub(D.iv)}, k, ub(D.ct)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) {
    var run = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === "complete") setTimeout(run, 0); else window.addEventListener("load", function () { setTimeout(run, 0); }, {once: true});
  }
  function open(bits) { return decrypt(bits).then(show); }
  function derive(p) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"])
      .then(function (b) { return crypto.subtle.deriveBits({name: "PBKDF2", salt: ub(D.salt), iterations: D.iter, hash: "SHA-256"}, b, 256); });
  }
  function ask() { f.hidden = false; pw.focus(); }

  if (!window.crypto || !crypto.subtle) { f.hidden = false; err.textContent = "Ce navigateur ne permet pas d'ouvrir l'appli. Ouvrez le lien dans Safari ou Chrome, en https."; err.hidden = false; go.disabled = true; return; }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    open(ub(saved)).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} ask(); });
  } else ask();

  document.getElementById("show").addEventListener("change", function (e) { pw.type = e.target.checked ? "text" : "password"; });
  f.addEventListener("submit", function (e) {
    e.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = "Ouverture…";
    var bits, remember = document.getElementById("rem").checked;
    derive(pw.value).then(function (b) { bits = b; return decrypt(b); })
      .then(function (html) { if (remember) { try { localStorage.setItem(KEY, bb(bits)); } catch (e2) {} } show(html); })
      .catch(function () { err.hidden = false; go.disabled = false; go.textContent = "Ouvrir"; pw.select(); });
